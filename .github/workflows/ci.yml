name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Build
        run: npm run build

      - name: Install Chromium for the browser-driven tests
        run: npx playwright install --with-deps chromium

      # Both run in the browser like everything else, because that's how the
      # TypeScript source gets loaded. Neither needs photo fixtures.
      - name: Assignment solver
        run: npm run test:assign

      - name: Import read-ahead
        run: npm run test:readahead

      - name: Proxy decode
        run: npm run test:decode

      # End-to-end drives the real UI and inspects the ZIP that comes out.
      - name: End-to-end
        run: npm test

      # Grouping and pairing precision/recall across eight adversarial scenarios.
      # The real-photo suite is not run here: its fixtures are photographs of
      # real cars with visible plates and are deliberately not in the repo.
      - name: Accuracy
        run: npm run test:accuracy
